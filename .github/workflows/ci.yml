name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Lightweight deps only: the data pipeline tests don't need torch.
      # API tests skip automatically when torch / a trained model are absent.
      - run: pip install pandas scikit-learn pytest ruff
      - run: ruff check .
      - run: pytest -q
